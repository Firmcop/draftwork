name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e.mjs
      - run: node tests/e2e-sketch.mjs
      - run: node tests/e2e-assembly.mjs
      - run: node tests/e2e-drawing.mjs
      - run: node tests/e2e-model.mjs
      - run: node tests/e2e-sketch2.mjs
      - run: node tests/e2e-surface.mjs
      - run: node tests/e2e-sheet.mjs
      - run: node tests/e2e-plastic.mjs
      - run: node tests/e2e-mesh.mjs
      - run: node tests/e2e-tools.mjs
      - run: node tests/e2e-drawing2.mjs
      - run: node tests/e2e-cam.mjs
      - run: node tests/e2e-sim.mjs
      - run: node tests/e2e-sim2.mjs
      - run: node tests/e2e-sim3.mjs
      - run: node tests/e2e-library.mjs
      - run: node tests/e2e-extents.mjs
      - run: node tests/e2e-shape.mjs
      - run: node tests/e2e-ui.mjs
      - run: node tests/e2e-gaps.mjs
      - run: node tests/e2e-product.mjs
      - run: node tests/e2e-configurator.mjs
      - run: node tests/e2e-configurator-static.mjs
      - run: node tests/e2e-ai.mjs
      - run: node tests/e2e-sketchux.mjs
      - run: node tests/e2e-pwa.mjs
      - run: node tests/e2e-precision.mjs
      - run: ENGINE_INLINE=1 node tests/e2e.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
