# Publishes the installable desktop app (dist/site) and the web configurator (dist/site/configurator) to GitHub Pages
# on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Desktop app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - run: node scripts/build-configurator.mjs   # dist/site/configurator: the web configurator, no server
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
